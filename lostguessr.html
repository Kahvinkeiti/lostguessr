<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LostGuessr</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css">
<style>
:root{
  --bg:#12141c; --panel:#1c2030; --panel2:#262b40; --text:#eef0f7; --muted:#9aa1bd;
  --accent:#ffb703; --accent2:#fb8500; --green:#2ecc71; --blue:#3b82f6; --red:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;z-index:50}
.screen.active{display:flex}

/* ---------- Language switch ---------- */
.langsel{position:fixed;top:10px;right:12px;z-index:300;width:124px;padding:8px 10px;border-radius:10px;
  border:1px solid #ffffff2a;background:#12141ccc;color:var(--text);font:inherit;font-size:14px;font-weight:600;
  backdrop-filter:blur(8px);outline:none;cursor:pointer}
.langsel:focus{border-color:var(--accent)}

/* ---------- Start ---------- */
#start,#lobby{align-items:center;justify-content:center;padding:16px;overflow:auto;
  background:radial-gradient(1200px 700px at 20% 0%,#2a3358 0%,transparent 60%),
             radial-gradient(900px 600px at 100% 100%,#4a2a14 0%,transparent 55%),var(--bg)}
.card{background:var(--panel);border:1px solid #ffffff14;border-radius:18px;padding:28px;
  width:100%;max-width:520px;box-shadow:0 20px 60px #0008;margin:auto}
.logo{font-size:36px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
.logo span{color:var(--accent)}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.45}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
input[type=text],select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #ffffff1f;
  background:var(--panel2);color:var(--text);font:inherit;outline:none}
input[type=text]:focus,select:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1204;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid #ffffff1f}
.btn.big{width:100%;margin-top:22px;font-size:18px;padding:16px}
.mapbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  padding:13px 14px;border-radius:10px;border:1px solid #ffffff1f;background:var(--panel2);color:var(--text);font:inherit;font-weight:600}
.mapbtn:hover,.mapbtn:focus{border-color:var(--accent);outline:none}
.mapbtn small{color:var(--muted);font-weight:500}
.best{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
.credit{margin-top:12px;font-size:11px;color:#ffffff55;text-align:center}
.err{background:#ef444422;border:1px solid #ef444466;color:#ffb4b4;padding:10px 12px;border-radius:10px;font-size:14px;margin-top:14px;display:none}

/* ---------- Map picker modal ---------- */
.modal{position:fixed;inset:0;z-index:200;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mcard{background:var(--panel);border:1px solid #ffffff1a;border-radius:16px;width:100%;max-width:460px;max-height:min(640px,90vh);
  display:flex;flex-direction:column;box-shadow:0 20px 60px #000a;overflow:hidden}
.mhead{display:flex;gap:8px;padding:12px;border-bottom:1px solid #ffffff12}
.mhead input{flex:1}
.mclose{background:var(--panel2);border:1px solid #ffffff1f;color:var(--text);border-radius:10px;padding:0 14px;font-size:16px}
#mapList{overflow:auto;padding:6px 8px 10px}
.grp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:12px 8px 4px}
.item{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--text);
  padding:10px 10px;border-radius:8px;font:inherit}
.item:hover{background:#ffffff10}
.item.sel{background:#ffb70322;color:var(--accent);font-weight:700}
.item small{color:var(--muted)}
.nomatch{padding:24px;text-align:center;color:var(--muted)}

/* ---------- Game ---------- */
#game{background:#000}
#viewer{position:absolute;inset:0;background:#0b0d13}
.hud{position:absolute;top:12px;left:12px;right:150px;display:flex;gap:10px;z-index:20;pointer-events:none;flex-wrap:wrap}
.chip{background:#12141ccc;backdrop-filter:blur(8px);border:1px solid #ffffff1c;border-radius:12px;
  padding:8px 14px;font-weight:700;font-size:15px;pointer-events:auto}
.chip small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.chip.timer.low{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.spacer{flex:1}
.hudbtn{background:#12141ccc;color:var(--text);border:1px solid #ffffff1c;border-radius:12px;padding:8px 14px;font-weight:600;pointer-events:auto}
.hudbtn:hover{background:#262b40}
#loading{position:absolute;inset:0;background:#0b0d13;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading.show{display:flex}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid #ffffff22;border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#guessBox{position:absolute;right:14px;bottom:34px;z-index:25;width:300px;height:210px;
  background:var(--panel);border-radius:14px;padding:6px;box-shadow:0 10px 40px #000a;
  transition:width .2s,height .2s,opacity .2s;opacity:.88;display:flex;flex-direction:column;gap:6px}
#guessBox:hover,#guessBox.pinned{width:min(640px,calc(100vw - 28px));height:min(470px,calc(100vh - 160px));opacity:1}
#miniMap{flex:1;border-radius:10px;cursor:crosshair;background:#aad3df}
.gbtns{display:flex;gap:6px}
.gbtns .btn{flex:1;padding:10px;font-size:15px}
.gbtns .btn.ghost{flex:0 0 auto;padding:10px 14px}
@media (hover:none){
  #guessBox{width:200px;height:150px}
  #guessBox:hover{width:200px;height:150px}
  #guessBox.pinned{width:calc(100vw - 28px);height:calc(100vh - 170px)}
}
@media (max-width:600px){ .hud{right:12px;top:52px} }

/* ---------- Result ---------- */
#result{background:var(--bg);flex-direction:column}
#resMap{flex:1}
.resbar{background:var(--panel);padding:18px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;border-top:1px solid #ffffff14}
.resbar .big{font-size:34px;font-weight:800;color:var(--accent);min-width:150px;text-align:center}
.resbar .big small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.resbar .dist{font-size:18px}
.resbar .dist small{display:block;color:var(--muted);font-size:12px}
.meter{flex:1;min-width:160px;max-width:380px;height:12px;background:#ffffff14;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--green));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 8px #0008}
.pin.guess{background:var(--blue)} .pin.truth{background:var(--green)}
.pin.mini{width:18px;height:18px}
.leaflet-container{font-family:inherit}

/* ---------- Final ---------- */
#final{align-items:center;justify-content:center;padding:16px;overflow:auto;
  background:radial-gradient(1000px 600px at 50% 0%,#2a3358 0%,transparent 60%),var(--bg)}
.total{font-size:56px;font-weight:900;color:var(--accent);text-align:center;margin:6px 0 2px}
.totalsub{text-align:center;color:var(--muted);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid #ffffff12}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.newbest{color:var(--green);text-align:center;font-weight:700;margin-bottom:8px}

/* ---------- Multiplayer ---------- */
.mcard.pad{padding:22px;overflow:auto}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.8px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:#ffffff1c}
.codein{text-transform:uppercase;letter-spacing:6px;font-weight:800;text-align:center;font-size:22px}
.roomcode{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--panel2);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
.roomcode small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.roomcode b{font-size:30px;letter-spacing:6px;color:var(--accent)}
.roomcode .btn{padding:9px 14px;font-size:14px}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.pl{display:flex;align-items:center;gap:10px;background:#ffffff08;border-radius:10px;padding:9px 12px;font-weight:600}
.pl small{color:var(--muted);margin-left:auto;font-weight:500}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #fff8;display:inline-block}
.lbgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
select:disabled,.mapbtn:disabled{opacity:.7;cursor:default}
#mpStatus{position:absolute;left:12px;top:76px;z-index:20;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.ps{display:flex;align-items:center;gap:8px;background:#12141ccc;border:1px solid #ffffff1c;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600;opacity:.65}
.ps.done{opacity:1}
.ps.done::after{content:"\2714";color:var(--green)}
#mpBoard{position:absolute;left:58px;top:12px;z-index:1100;background:#1c2030ee;backdrop-filter:blur(8px);border:1px solid #ffffff1c;border-radius:14px;padding:10px 12px;min-width:260px;max-width:calc(100vw - 80px);max-height:55vh;overflow:auto;display:none}
#mpBoard table{font-size:13px}
#mpBoard td,#mpBoard th{padding:6px 6px}
#waitHost{color:var(--muted);font-weight:600}
@media (max-width:600px){ #mpStatus{top:116px} }
</style>
</head>
<body>

<select id="lang" class="langsel" aria-label="Language">
  <option value="en">English</option>
  <option value="fi">Suomi</option>
  <option value="es">Español</option>
  <option value="fr">Français</option>
</select>

<!-- ============ START ============ -->
<div id="start" class="screen active">
  <div class="card">
    <h1 class="logo">Lost<span>Guessr</span></h1>
    <p class="sub" data-i18n="tagline"></p>

    <label data-i18n="map"></label>
    <button id="mapBtn" class="mapbtn" type="button"><span id="mapBtnName"></span><span>▾</span></button>

    <div class="row">
      <div><label for="cat" data-i18n="area"></label><select id="cat"></select></div>
      <div><label for="rounds" data-i18n="rounds"></label>
        <select id="rounds"><option>3</option><option selected>5</option><option>10</option></select></div>
    </div>
    <div class="row">
      <div><label for="time" data-i18n="time"></label><select id="time"></select></div>
      <div><label for="moving" data-i18n="moving"></label><select id="moving"></select></div>
    </div>

    <div id="startErr" class="err"></div>
    <button id="playBtn" class="btn big" data-i18n="play"></button>
    <button id="mpBtn" class="btn big ghost" style="margin-top:10px" data-i18n="mpBtn"></button>
    <div id="bestInfo" class="best"></div>
    <div class="credit" data-i18n="credit"></div>
  </div>
</div>

<!-- ============ MAP PICKER ============ -->
<div id="mapModal" class="modal">
  <div class="mcard">
    <div class="mhead">
      <input id="mapSearch" type="text" autocomplete="off" spellcheck="false">
      <button id="mapClose" class="mclose" type="button">✕</button>
    </div>
    <div id="mapList"></div>
  </div>
</div>

<!-- ============ LOBBY ============ -->
<div id="lobby" class="screen">
  <div class="card">
    <h1 class="logo">Lost<span>Guessr</span></h1>
    <div class="roomcode">
      <div><small data-i18n="roomCode"></small><b id="roomCode"></b></div>
      <button id="copyBtn" class="btn ghost" type="button"></button>
    </div>
    <label data-i18n="players"></label>
    <div id="lobbyPlayers" class="plist"></div>
    <label for="lbMode" data-i18n="mode"></label>
    <select id="lbMode"></select>
    <label data-i18n="map"></label>
    <button id="lbMapBtn" class="mapbtn" type="button"><span id="lbMapName"></span><span>▾</span></button>
    <div class="lbgrid">
      <div><label for="lbCat" data-i18n="area"></label><select id="lbCat"></select></div>
      <div id="lbRoundsWrap"><label for="lbRounds" data-i18n="rounds"></label><select id="lbRounds"></select></div>
    </div>
    <div class="lbgrid">
      <div><label for="lbTime" data-i18n="time"></label><select id="lbTime"></select></div>
      <div><label for="lbMoving" data-i18n="moving"></label><select id="lbMoving"></select></div>
    </div>
    <div id="lobbyErr" class="err"></div>
    <div id="lobbyHint" class="best"></div>
    <button id="lobbyStart" class="btn big" data-i18n="startGame"></button>
    <button id="lobbyLeave" class="btn big ghost" style="margin-top:10px" data-i18n="leaveRoom"></button>
  </div>
</div>

<!-- ============ MULTIPLAYER MODAL ============ -->
<div id="mpModal" class="modal">
  <div class="mcard pad">
    <h2 style="margin:0 0 2px" data-i18n="mpTitle"></h2>
    <label for="mpName" data-i18n="yourName"></label>
    <input id="mpName" type="text" maxlength="16" autocomplete="off" spellcheck="false">
    <button id="mpCreate" class="btn big" data-i18n="createRoom"></button>
    <div class="sep" data-i18n="or"></div>
    <input id="mpCode" class="codein" type="text" maxlength="6" autocomplete="off" spellcheck="false">
    <button id="mpJoin" class="btn big ghost" style="margin-top:10px" data-i18n="joinRoom"></button>
    <div id="mpErr" class="err"></div>
    <button id="mpCancel" class="btn big ghost" style="margin-top:10px" data-i18n="cancel"></button>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game" class="screen">
  <div id="viewer"></div>
  <div class="hud">
    <div class="chip"><small data-i18n="round"></small><span id="hudRound">1 / 5</span></div>
    <div class="chip"><small id="hudScoreLab" data-i18n="score"></small><span id="hudScore">0</span></div>
    <div class="chip timer" id="hudTimerChip" style="display:none"><small data-i18n="timeLab"></small><span id="hudTimer">0:00</span></div>
    <div class="spacer"></div>
    <button class="hudbtn" id="homeBtn" data-i18n="home" data-i18n-title="homeTitle"></button>
    <button class="hudbtn" id="quitBtn" data-i18n="quit"></button>
  </div>

  <div id="mpStatus"></div>

  <div id="guessBox">
    <div id="miniMap"></div>
    <div class="gbtns">
      <button class="btn ghost" id="pinBtn" data-i18n-title="pinTitle">⤢</button>
      <button class="btn" id="guessBtn" disabled></button>
    </div>
  </div>

  <div id="loading" class="show"><div class="spin"></div><div id="loadMsg"></div></div>
</div>

<!-- ============ RESULT ============ -->
<div id="result" class="screen">
  <div id="resMap"></div>
  <div id="mpBoard"></div>
  <div class="resbar">
    <div class="big"><small data-i18n="roundScore"></small><span id="resPts">0</span></div>
    <div class="meter"><i id="resMeter"></i></div>
    <div class="dist" id="resDist"></div>
    <button class="btn" id="nextBtn"></button>
    <span id="waitHost" style="display:none"></span>
  </div>
</div>

<!-- ============ FINAL ============ -->
<div id="final" class="screen">
  <div class="card">
    <h1 class="logo" style="text-align:center" data-i18n="finTitle"></h1>
    <div class="total" id="finTotal">0</div>
    <div class="totalsub" id="finSub"></div>
    <div id="finBest" class="newbest"></div>
    <table id="finTable"></table>
    <button class="btn big" id="againBtn" data-i18n="again"></button>
    <button class="btn big ghost" id="menuBtn" style="margin-top:10px" data-i18n="toSettings"></button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

};
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function haversine(a,b){
  const R=6371, rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad, dLon=(b.lng-a.lng)*rad;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtTime = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }

const COUNTRIES = RAW.map(([code,cont,bbox,cap,cities]) => ({
  code, cont, bbox, cap, cities,
  diag: haversine({lat:bbox[0],lng:bbox[1]},{lat:bbox[2],lng:bbox[3]})
}));

  if(v) for(const x in v) s = s.split('{'+x+'}').join(v[x]);

};
const nf = n => Number(n).toLocaleString(LOCALES[lang]);
const fmtDist = km => km<1 ? Math.round(km*1000)+' m' : (km<100? km.toFixed(1).replace('.',lang==='en'?'.':',') : nf(Math.round(km)))+' km';

let dnLocal, dnEn;

function regionInfo(region, cat){
  let countries, scale, bbox=null, view=null;
  if(CONT[region]){
    const c = CONT[region];
    countries = region==='world' ? COUNTRIES : COUNTRIES.filter(x=>x.cont===region);
    scale = c.scale; view = c.view || null; bbox = c.bbox || null;
  } else {
    const c = BY_CODE[region];
    countries = [c]; bbox = c.bbox;
    scale = cat==='capital' ? 10 : cat==='cities' ? Math.max(15,c.diag*0.12) : Math.max(15,c.diag*0.15);
  }
  return {countries, scale, bbox, view};
}

  const ctrs = COUNTRIES.map(c=>({c, name:countryName(c.code), en:(()=>{try{return dnEn.of(c.code)}catch(e){return c.code}})()}))
    .filter(x=>!q || norm(x.name).includes(q) || norm(x.en).includes(q) || x.c.code.toLowerCase()===q)
    .sort((a,b)=>a.name.localeCompare(b.name,LOCALES[lang]));
  if(!conts.length && !ctrs.length){ const d=document.createElement('div'); d.className='nomatch'; d.textContent=t('noMatch'); list.appendChild(d); return; }
  if(conts.length){ grp(t('grpWorld')); conts.forEach(k=>add(k,t('c_'+k))); }
  if(ctrs.length){ grp(t('grpCountries')); ctrs.forEach(x=>add(x.c.code,x.name,x.c.code)); }
}

/* ================== GAME STATE ================== */
let cfg, state, viewer=null, pendingLoc=null, usedIds=new Set();

let lastErr=null, lastRes=null, loadKey='searching';

class AppError extends Error{ constructor(key){ super(key); this.key=key; } }
class FatalError extends AppError{}

/* ---- API key pool ---- */
function pickLeastUsed(pool){
  const id = tk => 'lg_use_' + (tk.split('|')[1] || tk);
  const counts = pool.map(tk => Number(store.get(id(tk))||0));
  const min = Math.min(...counts);
  const cand = pool.filter((tk,i)=>counts[i]===min);
  const tk = cand[Math.floor(Math.random()*cand.length)];
  store.set(id(tk), min+1);
  return tk;
}

/* ================== LOCATION SEARCH (Mapillary Graph API) ================== */
async function fetchJson(url, ms=9000){
  const ctl = new AbortController(); const tm=setTimeout(()=>ctl.abort(),ms);
  try{
    const r = await fetch(url,{signal:ctl.signal});
    if(r.status===400 || r.status===401 || r.status===403) throw new FatalError('errKey');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}

function genPoint(){
  const c = pick(cfg.info.countries);
  let center, spread;
  if(cfg.cat==='capital'){ center=c.cap; spread=0.06; }
  else if(cfg.cat==='cities'){ center=pick(c.cities.length? c.cities : [c.cap]); spread=0.08; }
  else { center=pick([c.cap,...c.cities]); spread=Math.min(0.8,Math.max(0.08,c.diag/111*0.05)); }
  let lat = center[0] + rand(-spread,spread);
  let lon = center[1] + rand(-spread,spread)/Math.max(0.3,Math.cos(center[0]*Math.PI/180));
  lat = Math.min(c.bbox[2],Math.max(c.bbox[0],lat));
  lon = Math.min(c.bbox[3],Math.max(c.bbox[1],lon));
  return [lat,lon];
}

async function findLocation(){
  let netFails = 0;
  for(let attempt=0; attempt<40; attempt++){
    const tok = pick(cfg.pool);
    const [lat,lon] = genPoint();
    const d = 0.035;
    const bbox = [lon-d,lat-d,lon+d,lat+d].map(x=>x.toFixed(5)).join(',');
    const wantPano = attempt < 20;
    const url = `https://graph.mapillary.com/images?access_token=${encodeURIComponent(tok)}`
      + `&fields=id,computed_geometry,geometry,is_pano&bbox=${bbox}&limit=200` + (wantPano?'&is_pano=true':'');
    let data;
    try{ data = await fetchJson(url); }
    catch(e){
      if(e instanceof FatalError){
        cfg.pool = cfg.pool.filter(x=>x!==tok);   // drop rejected key, carry on with the rest
        if(!cfg.pool.length) throw e;
        continue;
      }
      if(++netFails>6) throw new AppError('errNet');
      continue;
    }
    const items = (data.data||[]).filter(i=>!usedIds.has(i.id) && (i.computed_geometry||i.geometry));
    if(!items.length) continue;
    const it = pick(items);
    const g = (it.computed_geometry||it.geometry).coordinates;
    usedIds.add(it.id);
    return { id: it.id, lat: g[1], lng: g[0], pano: !!it.is_pano };
  }
  throw new AppError('errNoImages');
}

async function startGame(){

function lockMovement(){

async function nextRound(){
  state.round++; state.guess=null; state.loc=null;
  $('hudRound').textContent = `${state.round} / ${cfg.rounds}`;
  $('hudScore').textContent = nf(state.total);
  show('game'); setLoading(true,'searching');
  updateGuessBtn();
  $('guessBox').classList.remove('pinned');
  if(miniMarker){ miniMap.removeLayer(miniMarker); miniMarker=null; }
  resetMiniView();
  setTimeout(()=>miniMap.invalidateSize(),50);

  let loc, tries=0;
  while(true){
    loc = await (pendingLoc || findLocation()); pendingLoc=null;
    try{ await viewer.moveTo(loc.id); break; }
    catch(e){
      if(++tries>5) throw new AppError('errLoad');
      setLoading(true,'retrying'); pendingLoc=findLocation(); pendingLoc.catch(()=>{});
    }
  }
  state.loc = loc;
  setLoading(false);
  viewer.resize && viewer.resize();
  if(state.round < cfg.rounds) prefetch();
  startTimer();
  roundActive = true;
}

function startTimer(secs){
  stopTimer();
  const chip = $('hudTimerChip');
  const total = secs===undefined ? cfg.time : secs;
  if(!total){ chip.style.display='none'; return; }
  chip.style.display=''; chip.classList.remove('low');
  const end = Date.now() + total*1000;
  const tick = ()=>{
    const left = Math.max(0,(end-Date.now())/1000);
    $('hudTimer').textContent = fmtTime(Math.ceil(left));
    chip.classList.toggle('low', left<=10);
    if(left<=0){ stopTimer(); submitGuess(true); }
  };
  tick(); timerInt = setInterval(tick,250);
}
function stopTimer(){ if(timerInt){ clearInterval(timerInt); timerInt=null; } }

function submitGuess(timedOut){
  if(!roundActive) return;
  if(!state.guess && !timedOut) return;
  if(mp){ mpSubmitGuess(); return; }
  roundActive=false; stopTimer();
  const truth = {lat:state.loc.lat, lng:state.loc.lng};
  let dist=null, pts=0;
  if(state.guess){
    dist = haversine(state.guess, truth);
    pts = dist<0.025 ? 5000 : Math.round(5000*Math.exp(-dist/cfg.info.scale));
    pts = Math.min(5000,pts);
  }
  state.total += pts;
  state.results.push({dist,pts,truth,guess:state.guess});
  lastRes = {dist, pts, noGuess: timedOut && !state.guess};
  showResult(truth, pts);
}

function renderResultText(){
  if(!lastRes) return;
  $('resDist').innerHTML = lastRes.noGuess
    ? `<small>${t('timeUp')}</small>${t('noGuess')}`
    : `<small>${t('yourGuess')}</small>${t('away',{d:fmtDist(lastRes.dist)})}`;
  $('nextBtn').textContent = (mp ? mp.over : state.round>=cfg.rounds) ? t('showResults') : t('next');
}

function showResult(truth, pts){
  show('result');
  $('mpBoard').style.display='none'; $('waitHost').style.display='none'; $('nextBtn').style.display='';
  setTimeout(()=>{
    resMap.invalidateSize();
    resLayer.clearLayers();
    L.marker([truth.lat,truth.lng],{icon:pinIcon('truth')}).addTo(resLayer);
    const g = state.guess;
    if(g){
      L.marker([g.lat,g.lng],{icon:pinIcon('guess')}).addTo(resLayer);
      L.polyline([[g.lat,g.lng],[truth.lat,truth.lng]],{color:'#fff',weight:3,dashArray:'6 8',opacity:.9}).addTo(resLayer);
      resMap.fitBounds(L.latLngBounds([[g.lat,g.lng],[truth.lat,truth.lng]]).pad(0.4),{maxZoom:15,animate:true});
    } else {
      resMap.setView([truth.lat,truth.lng],8);
    }
  },60);
  renderResultText();
  const el=$('resPts'), meter=$('resMeter'); meter.style.width='0';
  requestAnimationFrame(()=>{ meter.style.width=(pts/50)+'%'; });
  const t0=performance.now(), dur=1100;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent = nf(Math.round(pts*e));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

const PEER_PREFIX = 'lostguessr-';
const COLORS = ['#3b82f6','#ef4444','#22c55e','#f59e0b','#a855f7','#06b6d4','#ec4899','#84cc16'];
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const HP0 = 6000, MAX_PLAYERS = 8, DUEL_MAX_ROUNDS = 20;
let mp = null, pickTarget = 'sp', mpErrKey = null, copyTimer = null;

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeColor = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#9aa1bd';
const colorPin = c => L.divIcon({className:'', html:`<div class="pin" style="background:${safeColor(c)}"></div>`, iconSize:[22,22], iconAnchor:[11,22]});
const validLL = (a,b) => typeof a==='number' && typeof b==='number' && isFinite(a) && isFinite(b) && Math.abs(a)<=90 && Math.abs(b)<=180;
const newCode = () => { let s=''; for(let i=0;i<5;i++) s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return s; };

function openPeer(id){
  return new Promise((resolve,reject)=>{
    let done=false, peer;
    try{ peer = id ? new Peer(id) : new Peer(); }catch(e){ reject({type:'network'}); return; }
    const to = setTimeout(()=>{ if(done) return; done=true; try{peer.destroy();}catch(e){} reject({type:'network'}); },12000);
    peer.on('open',()=>{ if(done) return; done=true; clearTimeout(to); resolve(peer); });
    peer.on('error',e=>{ if(done) return; done=true; clearTimeout(to); try{peer.destroy();}catch(_){} reject(e); });
  });
}

/* ---------- create / join ---------- */
async function mpCreate(){
  if(typeof Peer==='undefined'){ mpErr('errPeerLib'); return; }
  $('mpCreate').disabled=true; $('mpJoin').disabled=true;
  const name = myName(); store.set('lg_name',name);
  let peer=null, code=null;
  for(let i=0;i<6 && !peer;i++){
    code = newCode();
    try{ peer = await openPeer(PEER_PREFIX+code); }
    catch(e){ if(!e || e.type!=='unavailable-id'){ mpErr('errSignal'); return; } }
  }
  if(!peer){ mpErr('errSignal'); return; }
  mp = { isHost:true, code, peer, conns:{}, me:'host',
    players:[{id:'host',name,color:COLORS[0],host:true,total:0,hp:HP0}],
    settings:{region:sel.region,cat:sel.cat,rounds:+$('rounds').value,time:+$('time').value,moving:$('moving').value==='1',mode:'classic'},
    phase:'lobby', round:0, guesses:{}, ready:{}, done:new Set(), submitted:false, lobbyErr:null };
  peer.on('connection',hostOnConnection);
  peer.on('disconnected',()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on('error',e=>console.warn('peer error',e));
  closeMpModal(); enterLobby();
}

async function mpJoin(){
  if(typeof Peer==='undefined'){ mpErr('errPeerLib'); return; }
  const code = $('mpCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4){ mpErr('errCode'); return; }
  $('mpCreate').disabled=true; $('mpJoin').disabled=true;
  const name = myName(); store.set('lg_name',name);
  let peer;
  try{ peer = await openPeer(null); }catch(e){ mpErr('errSignal'); return; }
  let opened=false, dead=false, to=null;
  const abort = key => { if(dead) return; dead=true; clearTimeout(to); try{peer.destroy();}catch(e){} mpErr(key); };
  const conn = peer.connect(PEER_PREFIX+code,{reliable:true});
  to = setTimeout(()=>{ if(!opened) abort('errRoom'); },12000);
  peer.on('error',e=>{ if(!opened) abort(e && e.type==='peer-unavailable' ? 'errRoom' : 'errSignal'); else console.warn(e); });
  conn.on('open',()=>{
    if(dead) return;
    opened=true; clearTimeout(to);
    mp = { isHost:false, code, peer, hostConn:conn, me:peer.id, players:[], settings:null, phase:'joining',
           done:new Set(), submitted:false, lobbyErr:null, round:0 };
    conn.send({t:'join',name});
    closeMpModal();
  });
  conn.on('data',guestOnData);
  conn.on('close',()=>{ if(mp && mp.hostConn===conn) leaveRoom('errHostLeft'); else if(!opened) abort('errRoom'); });
  conn.on('error',()=>{ if(!opened) abort('errRoom'); });
}

function leaveRoom(errKey){
  stopTimer(); roundActive=false; setLoading(false);
  const m = mp; mp = null;
  pendingLoc = null;
  if(m){
    try{
      if(m.isHost){ Object.values(m.conns).forEach(c=>{ try{ c.send({t:'closed'}); }catch(e){} }); clearTimeout(m.dl); }
      else { m.hostConn.close(); }
    }catch(e){}
    setTimeout(()=>{ try{ m.peer.destroy(); }catch(e){} }, 500);
  }
  show('start');
  if(errKey) showErr(new AppError(errKey));
}

/* ---------- host: connections ---------- */
function hostOnConnection(conn){
  conn.on('data', d=>hostOnData(conn,d));
  conn.on('close', ()=>hostOnLeave(conn.peer));
  conn.on('error', ()=>hostOnLeave(conn.peer));
}
function rejectConn(conn,key){
  const send = () => { try{ conn.send({t:'reject',key}); }catch(e){} setTimeout(()=>{ try{conn.close();}catch(e){} },400); };
  if(conn.open) send(); else conn.on('open',send);
}
function uniqueName(n){
  let name=n, i=2;
  while(mp.players.some(p=>p.name===name)) name = n.slice(0,13)+' '+(i++);
  return name;
}
function hostOnData(conn,d){
  if(!mp || !mp.isHost || !d || typeof d!=='object') return;
  const pid = conn.peer;
  switch(d.t){
    case 'join': {
      if(mp.conns[pid]) return;
      if(mp.phase!=='lobby'){ rejectConn(conn,'errBusy'); return; }
      if(mp.players.length>=MAX_PLAYERS){ rejectConn(conn,'errFull'); return; }
      mp.conns[pid]=conn;
      const color = COLORS.find(c=>!mp.players.some(p=>p.color===c)) || COLORS[0];
      mp.players.push({id:pid,name:uniqueName(String(d.name||'Player').trim().slice(0,16)||'Player'),color,host:false,total:0,hp:HP0});
      broadcastLobby();
      break;
    }
    case 'ready': hostOnReady(pid,d); break;
    case 'guess': hostOnGuess(pid,d); break;
  }
}
function hostOnLeave(pid){
  if(!mp || !mp.isHost || !mp.conns[pid]) return;
  delete mp.conns[pid];
  mp.players = mp.players.filter(p=>p.id!==pid);
  delete mp.guesses[pid]; mp.done.delete(pid);
  if(mp.phase==='lobby'){ broadcastLobby(); return; }
  if(mp.phase==='final'){ broadcast({t:'players',players:mp.players}); return; }
  if(mp.players.length<2){ hostFinish(); return; }
  broadcast({t:'players',players:mp.players}); renderStatus();
  if(mp.phase==='guessing') hostCheckAllGuessed();
}
function broadcastLobby(){
  broadcast({t:'lobby',players:mp.players,settings:mp.settings});
  renderLobby();
}

function updateHud(){

  const duel = !!(mp && mp.settings && mp.settings.mode==='duel');
  const me = mp ? mp.players.find(p=>p.id===mp.me) : null;
  $('hudRound').textContent = duel ? String(state.round) : `${state.round} / ${cfg.rounds}`;
  $('hudScoreLab').textContent = duel ? t('hp') : t('score');
  $('hudScore').textContent = nf(me ? (duel ? me.hp : me.total) : state.total);
}
function renderStatus(){
  const el=$('mpStatus'); el.innerHTML='';
  if(!mp) return;
  mp.players.forEach(p=>{
    const d=document.createElement('div'); d.className='ps'+(mp.done.has(p.id)?' done':'');
    const dot=document.createElement('span'); dot.className='dot'; dot.style.background=safeColor(p.color);
    const n=document.createElement('span'); n.textContent=p.name;
    d.append(dot,n); el.appendChild(d);
  });
}
function mpMarkGuessed(pid){ if(!mp) return; mp.done.add(pid); renderStatus(); }

function hostStartGame(){
  if(!mp || !mp.isHost || mp.phase!=='lobby') return;
  const n=mp.players.length, s=mp.settings;
  if(n<2 || (s.mode==='duel' && n!==2)) return;
  mp.lobbyErr=null; mp.phase='starting'; mp.round=0;
  mp.players.forEach(p=>{ p.total=0; p.hp=HP0; });
  broadcast({t:'start',settings:s,players:mp.players});
  mpBeginGame(s);
  hostNextRound();
}

/* ---------- host: round loop ---------- */
const mpGuestsAllReady = () => Object.keys(mp.conns).every(pid=>pid in mp.ready);

async function hostNextRound(){
  if(!mp || !mp.isHost) return;
  const round = ++mp.round;
  mp.phase='prep'; mp.guesses={}; mp.ready={}; mp.loc=null;
  clearTimeout(mp.dl); mp.dl=null;
  mpResetRound(round);
  const alive = () => mp && mp.isHost && mp.round===round && mp.phase==='prep';
  try{
    for(let att=0; att<4; att++){
      const loc = await (pendingLoc || findLocation()); pendingLoc=null;
      if(!alive()) return;
      mp.loc=loc; mp.att=att; mp.ready={};
      state.loc={id:loc.id};
      broadcast({t:'prep',round,att,loc:{id:loc.id}});
      const hostLoad = viewer.moveTo(loc.id).then(()=>true,()=>false);
      const deadline = Date.now()+20000;
      while(alive() && Date.now()<deadline && !mpGuestsAllReady()) await sleep(150);
      const hostOk = await hostLoad;
      if(!alive()) return;
      const guestsOk = Object.keys(mp.conns).every(pid=>mp.ready[pid]===true);
      if(hostOk && (guestsOk || att===3)) break;
      if(!hostOk && att===3) throw new AppError('errLoad');
      setLoading(true,'retrying');
    }
  }catch(e){ if(alive()) hostAbort(e); return; }
  if(!alive()) return;
  const secs = cfg.time;
  mp.phase='guessing'; mp.endAt = secs ? Date.now()+secs*1000 : Infinity; mp.countdown=false;
  if(mp.settings.mode==='duel' || round<cfg.rounds) prefetch();
  broadcast({t:'go',round,secs});
  setLoading(false); viewer.resize && viewer.resize();
  roundActive=true; startTimer(secs);
  mp.dl = secs ? setTimeout(hostEndRound,(secs+5)*1000) : null;
}
function hostAbort(e){
  if(!mp) return;
  console.error(e);
  const key = e instanceof AppError ? e.key : 'errNet';
  clearTimeout(mp.dl); roundActive=false; stopTimer(); setLoading(false);
  mp.phase='lobby'; mp.lobbyErr=key;
  broadcast({t:'toLobby',players:mp.players,err:key});
  enterLobby();
}
function hostOnReady(pid,d){
  if(!mp || mp.phase!=='prep' || d.round!==mp.round || d.att!==mp.att) return;
  mp.ready[pid] = d.ok===true;
}
function hostOnGuess(pid,d){
  if(!mp || mp.phase!=='guessing' || d.round!==mp.round) return;
  if(pid in mp.guesses) return;
  mp.guesses[pid] = validLL(d.lat,d.lng) ? {lat:d.lat,lng:d.lng} : null;
  mp.done.add(pid);
  broadcast({t:'guessed',pid}); renderStatus();
  if(hostCheckAllGuessed()) return;
  if(!mp.countdown){
    const remaining = (mp.endAt-Date.now())/1000;
    if(remaining>21){
      mp.countdown=true;
      broadcast({t:'countdown',secs:20});
      if(roundActive) startTimer(20);
      clearTimeout(mp.dl); mp.dl=setTimeout(hostEndRound,25000);
    }
  }
}
function hostCheckAllGuessed(){
  if(mp.phase!=='guessing') return false;
  if(mp.players.every(p=>p.id in mp.guesses)){ hostEndRound(); return true; }
  return false;
}
function hostEndRound(){
  if(!mp || !mp.isHost || mp.phase!=='guessing') return;
  mp.phase='result'; clearTimeout(mp.dl); mp.dl=null;
  const truth={lat:mp.loc.lat,lng:mp.loc.lng}, scale=cfg.info.scale;
  const duel = mp.settings.mode==='duel';
  const rows = mp.players.map(p=>{
    const g = mp.guesses[p.id] || null;
    let dist=null, pts=0;
    if(g){ dist=haversine(g,truth); pts = dist<0.025 ? 5000 : Math.min(5000,Math.round(5000*Math.exp(-dist/scale))); }
    return {id:p.id,name:p.name,color:p.color,guess:g,dist,pts,dmg:0};
  });
  let mult=1, loser=null, dmg=0;
  if(duel && rows.length===2){
    const [a,b]=rows;
    mult = Math.min(3, 1+0.5*Math.floor((mp.round-1)/2));
    dmg = Math.round(Math.abs(a.pts-b.pts)*mult);
    loser = a.pts<b.pts ? a : b.pts<a.pts ? b : null;
  }
  rows.forEach(r=>{
    const p=mp.players.find(x=>x.id===r.id);
    p.total += r.pts;
    if(loser===r){ p.hp=Math.max(0,p.hp-dmg); r.dmg=dmg; }
    r.total=p.total; r.hp=p.hp;
  });
  const over = duel ? (mp.players.some(p=>p.hp<=0) || mp.round>=DUEL_MAX_ROUNDS) : mp.round>=mp.settings.rounds;
  const res={t:'result',round:mp.round,truth,rows,over,mult};
  broadcast(res);
  mpShowResult(res);
}
function hostAfterResult(){
  if(!mp || !mp.isHost) return;
  if(mp.over) hostFinish(); else hostNextRound();
}
function hostFinish(){
  if(!mp) return;
  clearTimeout(mp.dl); stopTimer(); roundActive=false; setLoading(false);
  mp.phase='final';
  broadcast({t:'final',players:mp.players});
  mpShowFinal();
}
function hostToLobby(){
  if(!mp || !mp.isHost) return;
  mp.phase='lobby'; mp.lobbyErr=null;
  broadcast({t:'toLobby',players:mp.players});
  enterLobby();
}

/* ---------- guest: messages ---------- */
function guestOnData(d){
  if(!mp || mp.isHost || !d || typeof d!=='object') return;
  switch(d.t){
    case 'reject': leaveRoom(d.key==='errFull'?'errFull':'errBusy'); break;
    case 'lobby':
      mp.players=d.players||[]; mp.settings=d.settings; mp.phase='lobby';
      if($('lobby').classList.contains('active')) renderLobby(); else enterLobby();
      break;
    case 'start': mp.settings=d.settings; mp.players=d.players||[]; mp.phase='starting'; mp.lobbyErr=null; mpBeginGame(d.settings); break;
    case 'prep': guestPrep(d); break;
    case 'go': guestGo(d); break;
    case 'countdown': if(roundActive && typeof d.secs==='number') startTimer(d.secs); break;
    case 'guessed': mpMarkGuessed(d.pid); break;
    case 'players': mp.players=d.players||[]; renderStatus(); break;
    case 'result': mpShowResult(d); break;
    case 'final': mp.players=d.players||[]; mp.phase='final'; mpShowFinal(); break;
    case 'toLobby': mp.players=d.players||[]; mp.phase='lobby'; mp.lobbyErr=d.err||null; enterLobby(); break;
    case 'closed': leaveRoom('errHostLeft'); break;
  }
}
async function guestPrep(d){
  if(!d.loc || typeof d.loc.id!=='string') return;
  mp.round=d.round; mp.att=d.att; mp.phase='prep'; mp.loadOk=false;
  mpResetRound(d.round);
  state.loc={id:d.loc.id};
  let ok=false;
  try{ await viewer.moveTo(d.loc.id); ok=true; }catch(e){ ok=false; }
  if(!mp || mp.att!==d.att || mp.round!==d.round) return;   // superseded
  mp.loadOk=ok;
  try{ mp.hostConn.send({t:'ready',round:d.round,att:d.att,ok}); }catch(e){}
}
function guestGo(d){
  if(!mp || mp.round!==d.round) return;
  mp.phase='guessing';
  if(!mp.loadOk){
    setLoading(true,'errLoad'); roundActive=false; mp.submitted=true; updateGuessBtn();
    try{ mp.hostConn.send({t:'guess',round:d.round,lat:null,lng:null}); }catch(e){}
    return;
  }
  setLoading(false); viewer.resize && viewer.resize();
  roundActive=true; startTimer(typeof d.secs==='number' ? d.secs : 0);
}

/* ---------- guessing ---------- */
function mpSubmitGuess(){
  roundActive=false; stopTimer();
  const g=state.guess;
  const msg={t:'guess',round:mp.round,lat:g?g.lat:null,lng:g?g.lng:null};
  mp.submitted=true;
  if(mp.isHost) hostOnGuess('host',msg);
  else { try{ mp.hostConn.send(msg); }catch(e){} mpMarkGuessed(mp.me); }
  updateGuessBtn();
}

/* ---------- results / final ---------- */
function mpShowResult(m){
  if(!mp) return;
  roundActive=false; stopTimer();
  mp.phase='result'; mp.over=!!m.over; mp.lastResult=m;
  m.rows.forEach(r=>{ const p=mp.players.find(x=>x.id===r.id); if(p){ p.total=r.total; p.hp=r.hp; } });
  const mine = m.rows.find(r=>r.id===mp.me) || {pts:0,dist:null,guess:null};
  lastRes = {dist:mine.dist, pts:mine.pts, noGuess:!mine.guess};
  show('result');
  $('nextBtn').style.display = mp.isHost ? '' : 'none';
  $('waitHost').style.display = mp.isHost ? 'none' : '';
  $('waitHost').textContent = t('waitHostNext');
  setTimeout(()=>{
    resMap.invalidateSize(); resLayer.clearLayers();
    const truth=[m.truth.lat,m.truth.lng], all=[truth];
    L.marker(truth,{icon:pinIcon('truth')}).addTo(resLayer);
    m.rows.forEach(r=>{
      if(!r.guess) return;
      const ll=[r.guess.lat,r.guess.lng], c=safeColor(r.color);
      all.push(ll);
      const lab=document.createElement('span'); lab.textContent=r.name;
      L.polyline([ll,truth],{color:c,weight:3,dashArray:'6 8',opacity:.9}).addTo(resLayer);
      L.marker(ll,{icon:colorPin(c)}).bindTooltip(lab,{permanent:true,direction:'top',offset:[0,-24]}).addTo(resLayer);
    });
    if(all.length>1) resMap.fitBounds(L.latLngBounds(all).pad(0.4),{maxZoom:15,animate:true});
    else resMap.setView(truth,8);
  },60);
  renderResultText(); renderBoard(m);
  const el=$('resPts'), meter=$('resMeter'); meter.style.width='0';
  requestAnimationFrame(()=>{ meter.style.width=(mine.pts/50)+'%'; });
  const t0=performance.now(), dur=1100;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=nf(Math.round(mine.pts*e));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
function renderBoard(m){
  const duel = mp.settings.mode==='duel';
  const rows=[...m.rows].sort((a,b)=> duel ? b.pts-a.pts : b.total-a.total);
  const head=`<tr><th>${t('thPlayer')}</th><th>${t('thDist')}</th><th>${t('thPts')}</th><th>${duel?t('hp'):t('mpTotal')}</th></tr>`;
  const body=rows.map(r=>`<tr><td><span class="dot" style="background:${safeColor(r.color)};margin-right:6px;vertical-align:-1px"></span>${esc(r.name)}${r.id===mp.me?' ★':''}</td>`
    +`<td>${r.dist==null?'–':fmtDist(r.dist)}</td><td>${nf(r.pts)}</td>`
    +`<td><b>${nf(duel?r.hp:r.total)}</b>${duel&&r.dmg?` <small style="color:var(--red)">−${nf(r.dmg)}</small>`:''}</td></tr>`).join('');
  const note = duel && m.mult>1 ? `<div style="color:var(--muted);font-size:12px;margin-top:6px">${t('multiplier',{m:m.mult})}</div>` : '';
  const b=$('mpBoard'); b.innerHTML=`<table>${head}${body}</table>${note}`; b.style.display='block';
}
function mpShowFinal(){
  if(!mp) return;
  roundActive=false; stopTimer(); setLoading(false);
  show('final'); mpRenderFinal();
}
function mpRenderFinal(){
  if(!mp) return;
  const duel = mp.settings.mode==='duel';
  const list=[...mp.players].sort(duel ? (a,b)=>b.hp-a.hp||b.total-a.total : (a,b)=>b.total-a.total);
  const w=list[0];
  const tot=$('finTotal'); tot.style.fontSize='40px'; tot.textContent = w ? '🏆 '+w.name : '';
  $('finSub').textContent = `${regionName(mp.settings.region)} · ${catLabel(mp.settings.cat)}`;
  $('finBest').textContent = (w && w.id===mp.me) ? t('youWon') : '';
  const head=`<tr><th>${t('thPlayer')}</th>${duel?`<th>${t('hp')}</th>`:''}<th>${t('thPts')}</th></tr>`;
  const rows=list.map((p,i)=>`<tr><td>${i+1}. <span class="dot" style="background:${safeColor(p.color)};margin:0 6px 0 2px;vertical-align:-1px"></span>${esc(p.name)}${p.id===mp.me?' ★':''}</td>`
    +(duel?`<td>${nf(p.hp)}</td>`:'')+`<td><b>${nf(p.total)}</b></td></tr>`).join('');
  $('finTable').innerHTML=head+rows;
  $('againBtn').style.display = mp.isHost ? '' : 'none';
  $('againBtn').textContent = t('backToLobby');
  $('menuBtn').textContent = t('leaveRoom');
}

/* ---------- language refresh for multiplayer UI ---------- */
function mpApplyLang(){
  $('mpName').placeholder = t('yourName');
  $('mpCode').placeholder = t('roomCodePh');
  if(mpErrKey && $('mpErr').style.display==='block') $('mpErr').textContent=t(mpErrKey);
  if(!mp) return;
  buildLobbySelects(); renderLobby(); renderStatus(); updateHud();
  if($('result').classList.contains('active') && mp.lastResult){
    renderBoard(mp.lastResult);
    $('waitHost').textContent=t('waitHostNext');
  }
}

/* ---------- multiplayer events ---------- */
$('mpBtn').addEventListener('click',openMpModal);
$('mpCancel').addEventListener('click',closeMpModal);
$('mpModal').addEventListener('click',e=>{ if(e.target===$('mpModal')) closeMpModal(); });
$('mpCreate').addEventListener('click',mpCreate);
$('mpJoin').addEventListener('click',mpJoin);
$('mpCode').addEventListener('keydown',e=>{ if(e.key==='Enter') mpJoin(); });
$('mpCode').addEventListener('input',e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
$('lobbyStart').addEventListener('click',hostStartGame);
$('lobbyLeave').addEventListener('click',()=>leaveRoom());
$('lbMapBtn').addEventListener('click',()=>{ if(mp && mp.isHost) openMapPicker('mp'); });
$('copyBtn').addEventListener('click',async ()=>{
  if(!mp) return;
  const link = location.protocol==='file:' ? mp.code : location.href.split('#')[0].split('?')[0] + '#join=' + mp.code;
  try{ await navigator.clipboard.writeText(link); }
  catch(e){ try{ window.prompt('Copy:', link); }catch(_){} return; }
  $('copyBtn').textContent=t('copied');
  clearTimeout(copyTimer); copyTimer=setTimeout(()=>{ $('copyBtn').textContent=t('copyLink'); },1500);
});

/* ================== EVENTS ================== */
$('lang').value = lang;
$('lang').addEventListener('change',e=>{ lang=e.target.value; store.set('lg_lang',lang); applyLang(); });
$('mapBtn').addEventListener('click',()=>openMapPicker('sp'));
$('mapClose').addEventListener('click',closeMapPicker);
$('mapModal').addEventListener('click',e=>{ if(e.target===$('mapModal')) closeMapPicker(); });
$('mapSearch').addEventListener('input',renderMapList);
$('mapSearch').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ const f=document.querySelector('#mapList .item'); if(f) f.click(); }
  if(e.key==='Escape') closeMapPicker();
});
$('cat').addEventListener('change',e=>{ sel.cat=e.target.value; store.set('lg_cat',sel.cat); updateBest(); });
$('rounds').addEventListener('change',updateBest);
$('playBtn').addEventListener('click',startGame);
$('guessBtn').addEventListener('click',()=>submitGuess(false));
$('pinBtn').addEventListener('click',()=>{ $('guessBox').classList.toggle('pinned'); setTimeout(()=>miniMap.invalidateSize(),250); });
$('homeBtn').addEventListener('click',()=>{ if(state && state.loc && viewer) viewer.moveTo(state.loc.id).catch(()=>{}); });
$('quitBtn').addEventListener('click',()=>{ if(confirm(t('quitConfirm'))){ if(mp){ leaveRoom(); return; } stopTimer(); roundActive=false; show('start'); } });
$('nextBtn').addEventListener('click',async ()=>{
  if(mp){ if(mp.isHost && mp.phase==='result') hostAfterResult(); return; }
  if(state.round>=cfg.rounds){ endGame(); return; }
  try{ await nextRound(); }catch(e){ fail(e); }
});
$('againBtn').addEventListener('click',()=>{ if(mp){ if(mp.isHost) hostToLobby(); return; } startGame(); });
$('menuBtn').addEventListener('click',()=>{ if(mp) leaveRoom(); else show('start'); });
window.addEventListener('resize',()=>{ try{ viewer && viewer.resize(); }catch(e){} });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if($('mapModal').classList.contains('open')){ if(e.key==='Escape') closeMapPicker(); return; }
  if($('mpModal').classList.contains('open')) return;
  if((e.key==='Enter'||e.key===' ') && $('result').classList.contains('active')){ e.preventDefault(); $('nextBtn').click(); }
  else if(e.key==='Enter' && roundActive && state.guess){ e.preventDefault(); submitGuess(false); }
  else if((e.key==='m'||e.key==='M') && roundActive){ $('pinBtn').click(); }
});

/* ================== INIT ================== */
$('rounds').value = store.get('lg_rounds') || '5';
applyLang();
const hashJoin = location.hash.match(/join=([A-Za-z0-9]{4,6})/);
if(hashJoin){ $('mpCode').value = hashJoin[1].toUpperCase(); openMpModal(); }
})();
</script>
